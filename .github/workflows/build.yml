name: build

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  notebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX Live and tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-plain-generic poppler-utils g++ python3-pil

      - name: Build the notebook (colour and pure black)
        run: make both

      - name: Check every snippet is imported
        run: |
          extra=$(make showexcluded | grep -v '^make\|^grep\|^find' || true)
          if [ -n "$extra" ]; then
            echo "These files are not imported by any chapter.tex:"; echo "$extra"; exit 1
          fi
          echo "All snippets are imported."

      - name: Report page count
        id: pages
        run: |
          pages=$(pdfinfo notebook.pdf | awk '/^Pages:/{print $2}')
          echo "count=$pages" >> "$GITHUB_OUTPUT"
          echo "notebook.pdf is $pages pages" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$pages" -gt 25 ]; then
            echo "::warning::notebook.pdf is $pages pages, over the ICPC 25-page limit"
          fi

      - name: The black-and-white build must match the colour one
        run: |
          # Distinto numero de paginas significa que el flag \nbmono movio el
          # layout, no solo los colores: entonces las dos versiones ya no son
          # la misma pagina y el hash impreso puede caer en otro lado.
          bw=$(pdfinfo notebook-bw.pdf | awk '/^Pages:/{print $2}')
          echo "notebook-bw.pdf is $bw pages"
          [ "$bw" -eq "${{ steps.pages.outputs.count }}" ] || {
            echo "::error::notebook-bw.pdf has $bw pages, notebook.pdf has ${{ steps.pages.outputs.count }}"; exit 1; }
          # y no puede quedar ni un pixel de color
          pdftoppm -png -r 60 notebook-bw.pdf /tmp/bw
          python3 - <<'EOF'
          import glob
          from PIL import Image
          bad = 0
          for f in sorted(glob.glob('/tmp/bw-*.png')):
              for r, g, b in Image.open(f).convert('RGB').getdata():
                  if not r == g == b: bad += 1
          print(f"pixeles con color en notebook-bw.pdf: {bad}")
          raise SystemExit(1 if bad else 0)
          EOF

      - name: Code must print straight quotes, not typographic ones
        run: |
          # Without upquote, listings renders ' as U+2019. Code copied off the
          # page is then invalid as typed -- and for hash.sh it silently
          # produced d41d8c, the hash of empty input.
          pdftotext notebook.pdf /tmp/q.txt
          if grep -nE "\[[0-9]\]|[-+*/=(]" /tmp/q.txt | grep -q $'’'; then
            echo "::error::typographic quote found inside code; is upquote still loaded?"
            grep -nE "\[[0-9]\]|[-+*/=(]" /tmp/q.txt | grep $'’' | head -10
            exit 1
          fi
          echo "no typographic quotes inside code"

      - name: Every snippet must print a content hash
        run: |
          # A broken hash.sh fails silently: the build still succeeds and the
          # PDF just has no hashes, which nobody notices until a contest.
          pdftotext notebook.pdf /tmp/nb.txt
          want=0; got=0
          for f in $(grep -rho '\\nbimport[^{]*{[^}]*}' content/ | sed 's/.*{//;s/}//' | grep -E '\.h$|\.java$'); do
            want=$((want+1))
            p=$(find content -name "$f")
            h=$(sed '1,/\*\//d' "$p" | grep -v '^#pragma once' | grep -v exclude-line \
                | grep -v '^#include' | sh content/contest/hash.sh)
            grep -q "$h" /tmp/nb.txt && got=$((got+1)) || echo "no printed hash: $f (expected $h)"
          done
          echo "$got of $want snippets print a verifiable hash"
          [ "$got" -eq "$want" ]

      - name: No content may overflow its column
        run: |
          # An overfull hbox wider than a few pt visibly crosses the column rule
          # and overlaps the neighbouring column. Tiny ones are imperceptible.
          bad=$(grep -o 'Overfull \\hbox ([0-9.]*pt too wide' build/notebook.log \
                | grep -o '[0-9.]*' | awk '$1 > 5' | wc -l | tr -d ' ')
          total=$(grep -c 'Overfull .hbox' build/notebook.log || true)
          echo "overfull boxes: $total total, $bad wider than 5pt"
          if [ "$bad" -gt 0 ]; then
            echo "::error::$bad box(es) overflow the column by more than 5pt"
            grep -n 'Overfull .hbox' build/notebook.log | head -20
            exit 1
          fi

      - name: Every snippet must compile standalone
        run: ./scripts/test-compiles.sh

      - uses: actions/upload-artifact@v4
        with:
          name: notebook
          path: |
            notebook.pdf
            notebook-bw.pdf

      - name: Publish a versioned release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ github.run_number }}"
          pages="${{ steps.pages.outputs.count }}"
          snippets=$(find content -name '*.h' | wc -l | tr -d ' ')
          notes="$(git log -1 --pretty='%s')

          Commit \`${GITHUB_SHA:0:7}\` · $pages pages · $snippets snippets, all compiling standalone.

          Los links de abajo siempre apuntan al build mas nuevo:
          color: <https://github.com/$GITHUB_REPOSITORY/releases/latest/download/notebook.pdf>
          blanco y negro: <https://github.com/$GITHUB_REPOSITORY/releases/latest/download/notebook-bw.pdf>"

          # --latest makes GitHub resolve /releases/latest/download/notebook.pdf
          # here, so the permanent URL keeps working without a rolling tag.
          gh release create "$tag" notebook.pdf notebook-bw.pdf \
            --title "Build ${{ github.run_number }} - $pages pages" \
            --notes "$notes" --latest

          # Keep the newest 20 builds; older ones are archived history nobody reads.
          gh release list --limit 200 --json tagName,createdAt \
            -q 'sort_by(.createdAt) | reverse | .[20:] | .[].tagName' \
            | while read -r old; do
                [ -n "$old" ] && gh release delete "$old" --yes --cleanup-tag || true
              done

          echo "Released $tag -> https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" \
            | tee -a "$GITHUB_STEP_SUMMARY"
